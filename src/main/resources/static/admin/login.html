<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            DEFAULT: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        }
        .glow-gold:focus {
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="h-full flex items-center justify-center bg-darkBg px-4 sm:px-6 lg:px-8">

<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-yellow-600/10 rounded-full blur-3xl"></div>
</div>

<div class="relative w-full max-w-md space-y-8 bg-cardBg p-8 sm:p-10 rounded-2xl border border-amber-500/20 shadow-2xl backdrop-blur-xl">

    <div class="text-center">
        <div class="mx-auto w-16 h-16 rounded-2xl gold-gradient flex items-center justify-center shadow-lg shadow-amber-500/20 mb-4">
            <i class="fa-solid fa-shield-halved text-2xl text-darkBg"></i>
        </div>
        <h2 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Painel Administrativo</h2>
        <p class="mt-2 text-sm text-gray-400">Robux Rewards &bull; Acesso Restrito</p>
    </div>

    <div id="error-alert" class="hidden rounded-xl bg-red-500/10 border border-red-500/30 p-4 text-sm text-red-400 flex items-center gap-3">
        <i class="fa-solid fa-circle-exclamation text-lg flex-shrink-0"></i>
        <span id="error-message">Credenciais inválidas. Tente novamente.</span>
    </div>

    <form class="mt-8 space-y-6" action="/admin/login" method="POST">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5" for="username">Usuário ou E-mail</label>
                <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-500">
                    <i class="fa-solid fa-user"></i>
                </span>
                    <input id="username" name="username" type="text" required
                           class="block w-full rounded-xl bg-[#0b0f19] border border-gray-800 px-4 py-3 pl-11 text-white placeholder-gray-500 focus:border-amber-500 focus:outline-none glow-gold transition duration-200 text-sm"
                           placeholder="admin@robux.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5" for="password">Senha de Acesso</label>
                <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-500">
                    <i class="fa-solid fa-lock"></i>
                </span>
                    <input id="password" name="password" type="password" required
                           class="block w-full rounded-xl bg-[#0b0f19] border border-gray-800 px-4 py-3 pl-11 pr-11 text-white placeholder-gray-500 focus:border-amber-500 focus:outline-none glow-gold transition duration-200 text-sm"
                           placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500 hover:text-gray-300">
                        <i id="toggle-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
        </div>

        <div>
            <button type="submit" id="submit-btn"
                    class="w-full flex justify-center items-center py-3.5 px-4 rounded-xl gold-gradient text-darkBg font-bold text-sm shadow-lg shadow-amber-500/20 hover:opacity-95 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 focus:ring-offset-darkBg transition duration-200">
                <span>Entrar</span>
            </button>
        </div>
    </form>

    <div class="text-center pt-2">
        <p class="text-xs text-gray-500">&copy; 2026 Robux Rewards Admin. Todos os direitos reservados.</p>
    </div>
</div>
</body>
</html>
